<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kahve Sipariş Formu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>☕ Kahve Siparişi Ver</h1>

    <form id="orderForm">
      <label>İsim:
        <input type="text" name="name" maxlength="50" required />
      </label>

      <fieldset>
        <legend>Ürün:</legend>
        <div id="typeOptions"></div>
      </fieldset>

      <fieldset>
        <legend>Boyut:</legend>
        <div id="sizeOptions" class="choices"></div>
      </fieldset>

      <label>Not:
        <textarea name="note" maxlength="200" placeholder="(Opsiyonel)"></textarea>
      </label>

      <p class="total">Toplam: <strong id="total">-</strong></p>

      <button type="submit" id="submitBtn" disabled>Menü yükleniyor...</button>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
    </form>

    <hr>
    <h2>Siparişlerim</h2>
    <p id="emptyInfo" class="empty-info" hidden>Henüz sipariş vermediniz.</p>
    <ul id="orderList" class="orders"></ul>

    <p class="footer-link"><a href="admin.html">Barista girişi</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
