<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Ver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="Sipariş Ver">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" data-brand-mark>K</span>
        <div>
          <div class="brand-name" data-brand-name>Kahve Sipariş</div>
          <div class="brand-tagline" data-brand-tagline></div>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1 class="page-title">Sipariş verin</h1>
      <p class="page-sub">Menüden ürününüzü seçin, boyutu belirleyin ve siparişinizi tamamlayın.</p>
    </div>

    <div class="shop-grid">
      <!-- Menü -->
      <section aria-label="Menü">
        <div id="catTabs" class="cat-tabs" role="tablist" aria-label="Kategoriler"></div>
        <div id="menuList"><p class="empty">Menü yükleniyor...</p></div>
      </section>

      <!-- Sipariş paneli -->
      <aside class="order-col">
        <form id="orderForm" class="panel" novalidate>
          <div class="panel-head"><h2 class="panel-title">Siparişiniz</h2></div>
          <div class="panel-body">
            <div id="selection" class="selection"></div>

            <fieldset>
              <legend>Boyut</legend>
              <div id="sizeOptions" class="seg-group"></div>
            </fieldset>

            <label class="field">
              <span class="field-label">Adınız</span>
              <input type="text" name="name" maxlength="50" autocomplete="given-name" required />
            </label>

            <label class="field">
              <span class="field-label">Not (isteğe bağlı)</span>
              <textarea name="note" maxlength="200" placeholder="Örn. az şekerli"></textarea>
            </label>

            <div class="total-row">
              <span>Toplam</span>
              <strong id="total">-</strong>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-block" disabled>Menü yükleniyor...</button>
            <p id="message" class="message" role="status" aria-live="polite" hidden></p>
          </div>
        </form>

        <section class="panel" aria-label="Siparişlerim">
          <div class="panel-head"><h2 class="panel-title">Siparişlerim</h2></div>
          <p id="emptyInfo" class="empty" hidden>Henüz sipariş vermediniz.</p>
          <ul id="orderList" class="my-orders"></ul>
        </section>
      </aside>
    </div>
  </main>

  <footer class="app-footer"><a href="admin.html">Personel girişi</a></footer>

  <!-- Dar ekranlarda: seçilen ürün ve toplam -->
  <div id="mobileBar" class="mobile-bar">
    <div><small id="barLabel">Seçilen ürün</small><strong id="barTotal">-</strong></div>
    <a href="#orderForm" class="btn btn-primary">Siparişi tamamla</a>
  </div>

  <script src="brand.js"></script>
  <script src="script.js"></script>
</body>
</html>
