<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kahve Sipariş Formu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Kahve Siparişi Ver</h1>

    <form id="orderForm">
      <label>İsim:
        <input type="text" name="name" maxlength="50" required />
      </label>

      <label>Kahve Türü:
        <select name="type">
          <option value="Türk Kahvesi">Türk Kahvesi</option>
          <option value="Latte">Latte</option>
          <option value="Espresso">Espresso</option>
        </select>
      </label>

      <fieldset>
        <legend>Boyut:</legend>
        <label class="radio"><input type="radio" name="size" value="Küçük" required /> Küçük</label>
        <label class="radio"><input type="radio" name="size" value="Orta" /> Orta</label>
        <label class="radio"><input type="radio" name="size" value="Büyük" /> Büyük</label>
      </fieldset>

      <label>Not:
        <textarea name="note" maxlength="200" placeholder="(Opsiyonel)"></textarea>
      </label>

      <button type="submit" id="submitBtn">Gönder</button>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
    </form>

    <hr>
    <h2>Verilen Siparişler</h2>
    <p id="emptyInfo" class="empty-info" hidden>Henüz sipariş yok.</p>
    <ul id="orderList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
